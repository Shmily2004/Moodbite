name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.11: bản thấp nhất đã kiểm. 3.14: bản máy phát triển đang chạy (requirements.txt
    # đã nâng fastapi/uvicorn 2026-10-02 vì lý do 3.14). Chạy cả hai để lỗi chỉ xuất hiện
    # trên một phiên bản không lọt qua. fail-fast: false để thấy kết quả của cả hai.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chốt chặn quan trọng nhất: app PHẢI import và dựng được.
      # Trước đây app hỏng (NameError) mà CI vẫn xanh vì không test nào import app.
      - name: Smoke check - app phải dựng được
        run: python -c "from src.presentation.api.main import create_app; create_app(); print('app OK')"

      - name: Run pytest
        run: pytest -q

      # Chốt chặn kiến trúc: domain KHÔNG được phụ thuộc framework/thư viện hạ tầng.
      - name: Kiểm tra hướng phụ thuộc Clean Architecture
        run: python scripts/check_architecture.py

      # Mục 4 của verify.py: chỉ MỘT backend (1 FastAPI app, không .ts/.tsx ngoài
      # frontend/ và archive/, không package.json ở gốc). Không cần file dữ liệu.
      # Trước 2026-10 CI không có bước này - LanguageContext.tsx rỗng ở gốc lọt qua.
      - name: Kiểm tra chỉ có một backend (verify.py mục 4)
        run: python scripts/verify.py --chi 4

  frontend:
    name: Frontend (React + TypeScript + FSD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # Kiểm kiểu TOÀN monorepo: `npm run build` build CẢ HAI app (client + admin, mỗi app
      # tự chạy tsc), nhưng `packages/**` và `steiger.config.ts` thuộc project gốc
      # `frontend/tsconfig.json` nên chỉ bước typecheck này mới phủ.
      - name: Kiểm tra kiểu TypeScript (toàn monorepo)
        run: npm run typecheck

      # Build cả client lẫn admin; mỗi app đã bao gồm `tsc --noEmit`, nên sai tên field
      # API là CI đỏ ngay.
      - name: Build (client + admin)
        run: npm run build

      # Cả hai app. Trong đó có smoke test render <App /> - chốt chặn chống MÀN HÌNH
      # TRẮNG, tương đương "app phải dựng được" của backend.
      - name: Test (client + admin)
        run: npm run test

      # Chốt chặn kiến trúc frontend - bản tương đương check_architecture.py của backend.
      # Kiểm CẢ HAI app: bỏ sót admin nghĩa là chỉ canh được một nửa kiến trúc.
      - name: Kiểm tra luật import Feature-Sliced Design (client + admin)
        run: npm run lint:arch
