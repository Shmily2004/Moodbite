[pytest]
# Chỉ thu thập test ở `tests/`.
#
# VÌ SAO CÓ FILE NÀY (2026-08-17): trước đây không có cấu hình pytest nào, nên `pytest`
# quét từ thư mục gốc. Việc đó âm thầm ổn cho tới khi `archive/spatial-3d/tests/` xuất
# hiện — pytest thu thập luôn test của code đã tạm dừng, import `yaml`/`cv2` vừa bị gỡ
# khỏi requirements, và cả lượt chạy đứt ở bước collection.
#
# `archive/` là code ĐÃ NGHỈ HƯU: giữ để đối chiếu, KHÔNG chạy, KHÔNG tính vào độ phủ.
testpaths = tests
norecursedirs = archive .venv node_modules frontend .git data_pipeline/data_raw

# Báo lỗi nếu dùng marker chưa khai báo - tránh test bị lặng lẽ bỏ qua do gõ sai tên.
addopts = --strict-markers

# Lọc ĐÚNG HAI cảnh báo của THƯ VIỆN BÊN THỨ BA (thêm 2026-10-02), không lọc tràn lan.
#
# Vì sao: mỗi lượt pytest in ~31.000 cảnh báo, gần như toàn bộ từ fastapi 0.104 / starlette
# 0.27 (gọi `asyncio.iscoroutinefunction`, hàm Python 3.14 báo sắp bỏ) và httpx (lối tắt
# `app=` của TestClient cũ). Không phải code dự án, và phiên bản bị ghim có chủ đích trong
# requirements.txt. Để nguyên thì cảnh báo THẬT của dự án (vd ResourceWarning kết nối SQLite
# chưa đóng - đã sửa cùng ngày) chìm mất trong đống đó.
#
# ⚠️ KHÔNG phải "đã xong": `asyncio.iscoroutinefunction` bị XOÁ ở Python 3.16 - lúc đó
# fastapi 0.104 sẽ hỏng thật. Nâng fastapi/starlette/httpx là việc cần làm trước khi lên 3.16.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette.*
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx.*
